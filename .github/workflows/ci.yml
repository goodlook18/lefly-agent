name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-alpha:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: packages/lefly-console-web/package-lock.json
      - name: Validate tagged release inventory
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_public_release.py --root .
      - name: Install Python workspace packages
        run: >-
          python -m pip install
          'packages/lefly-protocol[test]'
          packages/lefly-sdk-python
          packages/lefly-simulator
          'packages/lefly-agent[llm]'
      - name: Run Python tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s packages/lefly-simulator/tests -v
          python -m unittest discover -s packages/lefly-agent/tests -v
      - name: Audit source boundary and release metadata
        run: |
          python tools/audit_open_source_boundary.py packages tests tools
          python tools/check_release_versions.py --root . --expected 0.1.1
      - name: Validate public tree
        run: python tools/check_public_release.py --root . --skip-inventory
      - name: Verify clean installed runtime chains
        run: |
          python tools/smoke_clean_install.py
          python tools/smoke_m3_agent.py
      - name: Install Console dependencies
        working-directory: packages/lefly-console-web
        run: npm ci
      - name: Test and build Console
        working-directory: packages/lefly-console-web
        run: |
          npm test
          npm run build
      - name: Verify packaged Console is current
        run: git diff --exit-code -- packages/lefly-simulator/src/lefly_simulator/static
