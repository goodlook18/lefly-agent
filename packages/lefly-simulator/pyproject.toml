[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lefly-simulator"
version = "0.1.1"
description = "Deterministic, hardware-free simulator core for LeFly devices"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "LeFly Agent contributors"}]
dependencies = [
  "aiohttp>=3.11,<4",
  "lefly-protocol>=0.1,<0.2",
  "lefly-sdk-python>=0.1,<0.2",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
test = []

[project.scripts]
lefly-simulator = "lefly_simulator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
lefly_simulator = ["static/*", "static/**/*"]
